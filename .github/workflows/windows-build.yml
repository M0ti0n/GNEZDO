name: Windows test build

# Builds gnezdo-windows.zip: GNEZDO.exe (self-contained, nothing to install) with the web pages,
# start.bat, config.example.json and INSTALL.txt, and publishes it as the "test-build" release:
#   https://github.com/M0ti0n/GNEZDO/releases/download/test-build/gnezdo-windows.zip
# Runs on every change to main, on a push to a build/... branch (a test build of work not merged
# yet), or by hand (Actions tab -> Windows test build -> Run workflow).
on:
  push:
    branches: [main, "build/**"]
    paths: ["frontend/**", "backend/src/**", "packaging/**", "nesting/**", ".github/workflows/windows-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  # PackingSolver for Windows (built once per version of nesting/packingsolver, then from the cache)
  solver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: out-solver
          key: solver-win-${{ hashFiles('nesting/packingsolver/**', 'nesting/patches/**') }}
      - name: Build packingsolver_irregular.exe
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cmake -S nesting/packingsolver -B build -DCMAKE_BUILD_TYPE=Release `
            -DPACKINGSOLVER_BUILD_TEST=OFF -DPACKINGSOLVER_USE_CLP=OFF -DPACKINGSOLVER_USE_HIGHS=ON
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build --config Release --target packingsolver_irregular -j 4
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          New-Item -ItemType Directory -Force out-solver | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter packingsolver_irregular.exe | Select-Object -First 1
          Copy-Item $exe.FullName out-solver/
          Get-ChildItem out-solver
      - name: It runs on Windows
        shell: pwsh
        run: |
          & out-solver/packingsolver_irregular.exe -i nesting/nestprep/examples/demo_sheets.json -o out.json -c sol.json -t 5 -v 0 --linear-programming-solver highs
          if ($LASTEXITCODE -ne 0) { throw "packingsolver_irregular.exe failed ($LASTEXITCODE)" }
          if (-not (Test-Path sol.json)) { throw "no solution written" }
          Write-Output "::notice title=PackingSolver::packingsolver_irregular.exe built and ran on Windows"
      - uses: actions/upload-artifact@v4
        with:
          name: solver-windows
          path: out-solver/packingsolver_irregular.exe

  build:
    needs: solver
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Web pages (database and demo)
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          VITE_USE_API=true npx vite build --outDir ../out/web-db --emptyOutDir
          VITE_USE_API=false npx vite build --outDir ../out/web-demo --emptyOutDir

      # Not a single file: a single-file exe unpacks its native parts into %TEMP% when it starts,
      # and many company PCs do not allow running anything from there ("Access is denied").
      - name: GNEZDO.exe (Windows, self-contained, plain folder)
        run: |
          dotnet publish backend/src/Gnezdo.Api -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=false -p:DebugType=none -o out/publish

      - uses: actions/download-artifact@v4
        with:
          name: solver-windows
          path: out/solver

      # The nesting engine: PackingSolver, nestprep and a Python of its own (with numpy), so
      # nothing has to be installed on the PC
      - name: Nesting engine for Windows
        run: |
          set -e
          n=out/nesting
          mkdir -p $n/python $n/nestprep
          cp out/solver/packingsolver_irregular.exe $n/
          PY=3.12.10
          curl -fsSL -o py.zip https://www.python.org/ftp/python/$PY/python-$PY-embed-amd64.zip
          unzip -q py.zip -d $n/python
          pip download numpy==2.2.6 --only-binary=:all: --platform win_amd64 --python-version 3.12 \
            --implementation cp --abi cp312 -d wheels -q
          mkdir -p $n/python/Lib/site-packages
          for w in wheels/*.whl; do unzip -q -o "$w" -d $n/python/Lib/site-packages; done
          # the embedded Python only looks where its ._pth file says
          pth=$(ls $n/python/python3*._pth)
          printf 'python312.zip\n.\nLib\\site-packages\nimport site\n' > "$pth"
          cat "$pth"
          cp nesting/nestprep/nestprep_cli.py $n/nestprep/
          mkdir -p $n/nestprep/nestprep
          cp nesting/nestprep/nestprep/*.py $n/nestprep/nestprep/
          cp nesting/PACKINGSOLVER_VERSION $n/
          du -sh $n

      - name: Assemble the zip
        run: |
          set -e
          d=out/gnezdo
          mkdir -p $d
          # the program and its libraries in a subfolder; the GNEZDO folder keeps what people use
          cp -r out/publish $d/program
          mv $d/program/Gnezdo.Api.exe $d/program/GNEZDO.exe
          rm -f $d/program/appsettings.Development.json $d/program/web.config
          # program defaults; without config.json it runs as a demo (no database set here)
          jq '.ConnectionStrings.Gnezdo = ""' out/publish/appsettings.json > $d/program/appsettings.json
          cp -r out/web-db $d/program/wwwroot
          cp -r out/web-demo $d/program/wwwroot-demo
          cp -r out/nesting $d/nesting
          cp packaging/start.bat packaging/config.example.json packaging/INSTALL.txt packaging/demo_server.py $d/
          echo "GNEZDO test build $(date -u +%Y-%m-%d) from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" > $d/VERSION.txt
          ls -la $d; ls $d/program | wc -l
          # the Python demo (for PCs that block GNEZDO.exe) serves the pages with the right types
          (cd $d && python3 demo_server.py 8099 >/dev/null 2>&1 &) ; sleep 2
          curl -fsS http://localhost:8099/ | grep -q 'id="root"'
          js=$(curl -fsS http://localhost:8099/ | grep -o 'assets/[^"]*\.js' | head -1)
          curl -fsSI "http://localhost:8099/$js" | grep -qi 'content-type: text/javascript'
          pkill -f "demo_server.py 8099" || true
          (cd out && zip -qr gnezdo-windows.zip gnezdo)
          ls -la out/gnezdo-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gnezdo-windows
          path: out/gnezdo-windows.zip

      - name: Publish as the test-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build out/gnezdo-windows.zip --prerelease --target "$GITHUB_SHA" \
            --title "Test build for Windows ($(date -u +%Y-%m-%d), ${GITHUB_REF_NAME})" \
            --notes "Unzip, double-click start.bat, open http://localhost:8090. Runs as a demo until a database is set in config.json - see INSTALL.txt."
          echo "::notice title=Download::https://github.com/${GITHUB_REPOSITORY}/releases/download/test-build/gnezdo-windows.zip"

  # Starts GNEZDO.exe on Windows from the zip, as a user would, and checks it answers.
  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: nesting/nestprep/examples
      - uses: actions/download-artifact@v4
        with:
          name: gnezdo-windows
      - name: Unzip and start (demo)
        shell: pwsh
        run: |
          Expand-Archive gnezdo-windows.zip -DestinationPath .
          Copy-Item gnezdo/config.example.json gnezdo/config.json
          # start.bat asks the program first whether it may run here
          & gnezdo/program/GNEZDO.exe --check
          if ($LASTEXITCODE -ne 0) { throw "--check failed" }
          # as start.bat does: the program from its subfolder, config.json from the GNEZDO folder
          $p = Start-Process -FilePath gnezdo/program/GNEZDO.exe -WorkingDirectory gnezdo -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep 2
            try { $h = Invoke-RestMethod http://localhost:8090/api/health; $ok = $true } catch { }
          }
          Get-Content out.txt, err.txt
          if (-not $ok) { throw "GNEZDO did not answer on http://localhost:8090" }
          if (-not $h.demo) { throw "expected demo mode" }
          $page = Invoke-WebRequest http://localhost:8090/
          if ($page.Content -notmatch "<div id=`"root`"") { throw "index.html not served" }
          $deep = Invoke-WebRequest http://localhost:8090/some/page
          if ($deep.StatusCode -ne 200) { throw "fallback to index.html failed" }
          # a real nest: the demo job through GNEZDO's API and the bundled engine
          $st = Invoke-RestMethod http://localhost:8090/api/nest/status
          if (-not $st.available) { throw "nesting not available: $($st.reason)" }
          $req = Get-Content repo/nesting/nestprep/examples/demo_request.json -Raw
          $run = Invoke-RestMethod -Method Post -Uri http://localhost:8090/api/nest -Body $req -ContentType "application/json"
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep 2
            $run = Invoke-RestMethod "http://localhost:8090/api/nest/$($run.id)"
            if ($run.state -in @("done", "stopped", "error")) { break }
          }
          $j = $run | ConvertTo-Json -Depth 4 -Compress
          Write-Output $j.Substring(0, [Math]::Min(800, $j.Length))
          if ($run.state -ne "done") { throw "nest ended as $($run.state): $($run.error)" }
          if (-not $run.result.valid) { throw "layout check failed: $($run.result.errors)" }
          Write-Output "::notice title=Nesting::demo job nested on Windows in $($run.seconds) s, $($run.result.sheets.Count) sheets"
          Stop-Process $p.Id
          # nothing may be unpacked into %TEMP%\.net (single-file extraction)
          if (Test-Path "$env:TEMP\.net") { throw "files were unpacked into %TEMP%" }
          # a taken port gives a plain message, not a crash dump
          $l = [System.Net.Sockets.TcpListener]::new([Net.IPAddress]::Any, 8090); $l.Start()
          $q = Start-Process -FilePath gnezdo/program/GNEZDO.exe -WorkingDirectory gnezdo -PassThru -Wait -RedirectStandardOutput out2.txt -RedirectStandardError err2.txt
          $l.Stop()
          $msg = Get-Content err2.txt -Raw
          Write-Output $msg
          if ($msg -notmatch "could not start" -or $msg -notmatch "8091") { throw "no plain message when the port is taken" }
          Write-Output "::notice title=Smoke test::GNEZDO.exe started on Windows, demo mode, pages served"

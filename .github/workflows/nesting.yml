name: Nesting (PackingSolver + nestprep)

# Builds our copy of PackingSolver and runs the nestprep pre-pass on a small demo job,
# only when something under nesting/ changes.
on:
  push:
    branches: [main]
    paths: ["nesting/**", ".github/workflows/nesting.yml"]
  pull_request:
    paths: ["nesting/**", ".github/workflows/nesting.yml"]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Copy is upstream + our patches
        run: nesting/update-packingsolver.sh --check

      - name: Build packingsolver_irregular
        working-directory: nesting/packingsolver
        run: |
          sudo apt-get install -y ninja-build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPACKINGSOLVER_BUILD_TEST=OFF -DPACKINGSOLVER_USE_CLP=OFF -DPACKINGSOLVER_USE_HIGHS=ON
          cmake --build build --target packingsolver_irregular -j4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: nestprep on the demo job
        working-directory: nesting/nestprep
        run: |
          pip install numpy matplotlib
          PS=../packingsolver/build/src/irregular/packingsolver_irregular
          python nestprep_cli.py compare examples/demo_holes.json --solver $PS -t 5 --outdir out --post quick
          # several sheets, so gap filling, the chain and sheet pairs have something to do
          python nestprep_cli.py compare examples/demo_sheets.json --solver $PS -t 5 --outdir out_sheets --post thorough
          python - <<'EOF'
          import json
          for d in ("out", "out_sheets"):
              r = json.load(open(f"{d}/compare.json"))
              for k in ("baseline", "prepass", "post"):
                  print(d, k, {x: r[k][x] for x in ("sheets", "sheet_equivalents", "parts_in_holes", "valid", "min_gap")})
                  assert r[k]["valid"], f"{d} {k}: a layout failed the validator"
              assert r["post"]["sheet_equivalents"] <= r["baseline"]["sheet_equivalents"], f"{d}: the whole job is worse than PackingSolver alone"
              print(d, "time", r["post"]["seconds"])
          assert json.load(open("out/compare.json"))["prepass"]["parts_in_holes"] > 0, "the pre-pass put nothing into the holes"
          EOF
          # a part bigger than every sheet: a clear error, not a crash
          python - <<'EOF'
          import json
          inst = json.load(open("examples/demo_sheets.json"))
          b = inst["bin_types"][0]
          big = max(b.get("width", 0), b.get("height", 0), 5000) * 2
          inst["item_types"].append({"type": "rectangle", "width": big, "height": 10, "copies": 1})
          json.dump(inst, open("too_big.json", "w"))
          EOF
          set +e
          out=$(python nestprep_cli.py nest too_big.json --level quick --solver $PS --outdir out_big -q)
          code=$?
          set -e
          echo "$out"
          test $code -eq 2
          echo "$out" | grep -q "Bigger than every stock sheet"

      - uses: actions/upload-artifact@v4
        with:
          name: packingsolver-linux
          path: |
            nesting/packingsolver/build/src/irregular/packingsolver_irregular
            nesting/nestprep/out*/*.png
            nesting/nestprep/out*/compare.json

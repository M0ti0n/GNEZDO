name: EF migration

# Creates an EF Core migration on GitHub (the dotnet tools are not needed on your PC).
# How: put the migration name on the first line of backend/migration-request.txt and push.
# This job adds the migration under Data/Migrations, deletes the request file and pushes
# the result to the same branch. Then push any commit (or re-run CI) to test it.
on:
  push:
    paths: ["backend/migration-request.txt"]

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Add migration
        run: |
          set -e
          name=$(head -1 backend/migration-request.txt | tr -cd 'A-Za-z0-9_')
          if [ -z "$name" ]; then echo "::error::backend/migration-request.txt must start with a migration name"; exit 1; fi
          dotnet tool install --global dotnet-ef --version 10.0.14
          dotnet build backend/Gnezdo.slnx
          dotnet ef migrations add "$name" --project backend/src/Gnezdo.Api --output-dir Data/Migrations
          git rm -q backend/migration-request.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/Gnezdo.Api/Data/Migrations
          git commit -m "Add EF migration $name (generated by the EF migration workflow)"
          git push
          echo "::notice title=Migration::Added $name"

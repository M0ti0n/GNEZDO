name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vite build

  backend:
    name: Backend (build + tests on SQL Server and SQLite)
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Gnezdo_Test_123
        ports:
          - 1433:1433
    env:
      GNEZDO_TEST_SQL: Server=localhost,1433;User Id=sa;Password=Gnezdo_Test_123;TrustServerCertificate=True;Encrypt=False
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: |
          set -o pipefail
          dotnet build backend/Gnezdo.slnx -c Release 2>&1 | tee build.log
      - name: Migrations up to date
        run: |
          # fails when the model changed without a migration (see .github/workflows/ef-migration.yml)
          dotnet tool install --global dotnet-ef --version 10.0.14 >/dev/null
          # both databases: SQL Server (server build) and SQLite (desktop build)
          for ctx in GnezdoDb GnezdoSqliteDb; do
            if ! dotnet ef migrations has-pending-model-changes --project backend/src/Gnezdo.Api --context $ctx --no-build --configuration Release > ef.log 2>&1; then
              echo "::error title=Migrations ($ctx)::$(tail -5 ef.log | sed ':a;N;$!ba;s/\n/%0A/g')"
              exit 1
            fi
          done
      - name: Package versions
        run: |
          # show which NuGet versions the build really used (top level), so pinning stays visible
          v=$(dotnet list backend/Gnezdo.slnx package 2>/dev/null | grep -E "^\s+>" | tr -s ' ' | sort -u | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Packages::$v"
      - name: Test
        run: |
          set -o pipefail
          dotnet test backend/Gnezdo.slnx -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee test.log
          echo "::notice title=Tests::$(grep -E 'Passed!|Failed!|Total tests|Passed:|Failed:' test.log | tr -s ' ' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Test on SQLite (the desktop build's database)
        env:
          GNEZDO_TEST_DB: sqlite
        run: |
          set -o pipefail
          dotnet test backend/Gnezdo.slnx -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee test-sqlite.log
          echo "::notice title=Tests on SQLite::$(grep -E 'Passed!|Failed!|Total tests|Passed:|Failed:' test-sqlite.log | tr -s ' ' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Report failures as annotations
        if: failure()
        run: |
          # Put errors and failed tests where they show on the PR page.
          for f in build.log test.log test-sqlite.log; do
            [ -f "$f" ] || continue
            msg=$(grep -E "error|Error|FAIL|Failed |Assert|Exception" "$f" | grep -v "0 Error" | sort -u | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            [ -n "$msg" ] && echo "::error title=$f::$msg"
          done
          exit 0

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t gnezdo-api .
      - name: The nesting engine runs in the image
        run: |
          mkdir -p run && chmod 777 run
          docker run --rm --entrypoint python3 -v "$PWD/nesting/nestprep/examples:/ex:ro" -v "$PWD/run:/run-out" gnezdo-api \
            /app/nesting/nestprep/nestprep_cli.py run /ex/demo_request.json /run-out --solver /app/nesting/packingsolver_irregular
          python3 -c "import json; r=json.load(open('run/result.json')); print(r['state'], r['seconds'], r['valid']); assert r['state']=='done' and r['valid']"
      - run: docker build -t gnezdo-web frontend

  linux-server:
    name: Linux server, end to end (docker compose)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Start web + API + SQL Server, as in the install notes
        run: |
          cat > .env <<'ENV'
          GNEZDO_PORT=8080
          SQL_SA_PASSWORD=Smoke_Test_Pass1!
          GNEZDO_DB=Server=db,1433;Database=gnezdo;User Id=sa;Password=Smoke_Test_Pass1!;TrustServerCertificate=True;Encrypt=False
          GNEZDO_SAMPLE_DATA=false
          ENV
          docker compose --profile sqlserver up -d --build
      - name: Sign in, nest, users, sign out
        run: python3 .github/scripts/server_smoke.py http://localhost:8080
      - name: A restarted API keeps everyone signed in
        run: |
          docker compose restart api
          python3 .github/scripts/server_smoke.py http://localhost:8080 --after-restart
      - name: Logs
        if: always()
        run: docker compose --profile sqlserver logs --no-color --tail 200 api web
